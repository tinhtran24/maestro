name: Desktop release

on:
  push:
    tags:
      - "v*"
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-prefix: macos
          - os: windows-latest
            artifact-prefix: windows
          - os: ubuntu-latest
            artifact-prefix: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match app/package.json version $expected"
            exit 1
          fi

      - name: Build desktop app
        run: pnpm run make

      - name: Upload build outputs to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ARTIFACT_PREFIX: ${{ matrix.artifact-prefix }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "Desktop release $TAG" || \
              gh release view "$TAG" >/dev/null
          fi

          find out/make -type f -print0 | while IFS= read -r -d '' file; do
            name="${ARTIFACT_PREFIX}-$(basename "$file")"
            cp "$file" "$name"
            gh release upload "$TAG" "$name" --clobber
          done
